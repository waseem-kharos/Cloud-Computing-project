services:
  - type: web
    name: cloud-computing-project-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: true
      - key: CORS_ORIGINS
        value: '["https://cloud-computing-project-web.onrender.com"]'

  - type: web
    name: cloud-computing-project-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://cloud-computing-project-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
